<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro Formulario</title>
    </head>
    <body>
        <h1>Cadastro Formulario</h1>
        <div>
            <label>Nome</label>
            <input type="text" id="nome"></input>
        </div>
        <div>
            <label>Email</label>
            <input type="text" id="email" placeholder="usuario@gmail.com"></input>
        </div>
        <div>
            <label>Telefone</label>
            <input type="text" id="telefone" placeholder="(DDD) 9XXXX-XXXX"></input>
        </div>
    </body>
    <script>
        document.getElementById('nome').value = "Seu nome aqui";
    </script>

</html>
