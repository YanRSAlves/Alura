<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Contato</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <header class="menu">
        <h4 class="titulo">App de Atividades</h4>
       
        <nav>
            <a class="menu-item" href="index.html">Página inicial</a>
            <a class="menu-item" href="sobre.html">Sobre</a>
            <a class="menu-item" href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <section class="painel-cadastro">
            <h4 class="titulo">Cadastro de Contato</h4>
            
            <form>
               <label>Nome</label>
                <input type="text" placeholder="Seu nome"/> 

                <label>E-mail</label>
                <input type="text" placeholder="nome@email.com"/> 

                <label>Celular</label>
                <input type="text" placeholder="(DDD) 99999-9999"/> 
               
                <label>Mensagem</label>
                <input type="text"/> 

                <button type="submit">Enviar</button> 
            </form>
            

        </section>
    
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados @ Alura</p>
    </footer>
</body>
</html>
