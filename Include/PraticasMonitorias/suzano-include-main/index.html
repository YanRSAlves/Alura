<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
 
<body>
    <header>
        <h4 class="titulo">Header</h4>
    </header>
    <main>
        <section class="card-cadastro">
            <h4 class="titulo">Cadastro de nova atividade</h4>
            <form>
                <label>Descrição</label>
                <input type="text" placeholder="Ex: Estudar CSS"/>
 
                <label>Complexidade</label>
                <input type="text" placeholder="Ex: Alta, Média, Baixa"/>
 
                <label>Data de entrega</label>
                <input type="date"/>
                
                <button type="button">Salvar Atividade</button>
            </form>
        </section>
    
        <section class="painel-imagens">
            <h4>Painel de Imagens</h4>
            <p>Suas imagens aparecerão aqui...</p>
        </section>
    </main>
 
    <footer>
        <h4>Rodapé menu</h4>
    </footer>
</body>
</html>
