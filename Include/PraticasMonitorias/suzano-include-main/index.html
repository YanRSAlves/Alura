<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="icon" type="image/x-icon" href="/images/html.ico">
</head>

<body>
    <header class="menu">
        <h4 class="titulo">App de Atividade</h4>
       
        <nav>
            <a class="menu-item" href="index.html">Página inicial</a>
            <a class="menu-item" href="sobre.html">Sobre</a>
            <a class="menu-item" href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <section class="painel-cadastro">
            <h4 class="titulo">Cadastro de nova atividade</h4>
            <form>
                <label>Descrição</label>
                <input type="text" placeholder="Ex: Estudar CSS"/>

                <label>Complexidade</label>
                <input type="text" placeholder="Ex: Alta, Média, Baixa"/>

                <label>Data de entrega</label>
                <input type="date"/>
                
                <button type="button">Salvar Atividade</button>
            </form>
        </section>
    
        <section class="painel-imagens">
            <h4>Painel de Atividades</h4>
            <p>Suas atividades aparecerão aqui...</p>
        </section>
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados @ Alura</p>
    </footer>
</body>
</html>
